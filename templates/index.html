<!DOCTYPE html>
<html>
<head>
    <title>SignConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container" id="container">

    <!-- Toggle Button (Always Visible) -->
    <button id="collapseBtn" onclick="toggleMeeting()">☰</button>

    <!-- LEFT: MEETING AREA -->
    <div class="meeting-area" id="meetingArea">
        <h2>Meeting Controls</h2>

        <div class="meeting-box">
            <button onclick="openMeeting()">Join Google Meet</button>

            <p class="status">
                Status:
                <span id="statusIndicator" class="disconnected">
                    ● Not Connected
                </span>
            </p>

            <div class="instructions">
                <h4>Instructions:</h4>
                <ol>
                    <li>Click "Join Google Meet"</li>
                    <li>Keep this page open</li>
                    <li>Unmute microphone if using AI voice output</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- RIGHT: SIGNCONNECT PANEL -->
    <div class="panel" id="rightPanel">
        <h2>SignConnect Panel</h2>

        <div class="section">
            <h3>Live Captions</h3>
            <p id="voiceText">Waiting for speech...</p>
        </div>

        <div class="section">
            <h3>Sign Detection</h3>

            <!-- Camera Feed -->
            <img src="/video_feed" class="camera-feed">

            <p id="signText">Waiting for sign...</p>

            <button onclick="playAudio()">Play Audio</button>
        </div>
    </div>

</div>
<script>
console.log("JS Loaded");

function openMeeting() {
    window.open(
        "https://meet.google.com",
        "MeetingWindow",
        "width=1000,height=700"
    );

    const status = document.getElementById("statusIndicator");
    status.innerText = "● Connected";
    status.classList.remove("disconnected");
    status.classList.add("connected");
}

/* 🎤 LIVE SPEECH-TO-TEXT (REAL-TIME) */
let recognition;

function startLiveTranscription() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Your browser does not support speech recognition. Use Chrome.");
        return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }

        document.getElementById("voiceText").innerText = transcript;
    };

    recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
    };

    recognition.start();
}

/* 🔊 TEXT TO SPEECH */
function playAudio() {
    const text = document.getElementById("signText").innerText;

    if (!text || text.trim() === "") {
        alert("No text to speak!");
        return;
    }

    const speech = new SpeechSynthesisUtterance(text);

    // Settings
    speech.lang = "en-US";   // language
    speech.rate = 1;         // speed (0.5 - 2)
    speech.pitch = 1;        // tone (0 - 2)
    speech.volume = 1;       // volume (0 - 1)

    // Optional: choose voice
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
        speech.voice = voices[0]; // you can change index
    }

    window.speechSynthesis.speak(speech);
}



/* 🎤 AUTO START TRANSCRIPTION */
startLiveTranscription();

async function fetchData() {
    try {
        const response = await fetch("/api/live");
        const data = await response.json();

        console.log("API DATA:", data); // debug

        document.getElementById("voiceText").innerText = data.voice_text;
        document.getElementById("signText").innerText = data.sign_text;

    } catch (error) {
        console.error("Error fetching data:", error);
    }
}

// 🔥 VERY IMPORTANT: call repeatedly
setInterval(fetchData, 1000);

/* TOGGLE UI */
function toggleMeeting() {
    const container = document.getElementById("container");
    container.classList.toggle("collapsed");
}
</script>

</body>
</html>
